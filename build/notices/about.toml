# cargo about: the licenses of the crates in the chroma executable, for the five targets of the runtime packages.
accepted = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "bzip2-1.0.6", "MPL-2.0", "0BSD", "OpenSSL",
]
targets = [
  "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
no-clearly-defined = true
