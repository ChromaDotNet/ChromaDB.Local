name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: C#
            language: csharp
            build-mode: none
          # The guard, built as build-linux.sh builds it.
          - name: C
            language: c-cpp
            build-mode: manual

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Build the guard
      if: matrix.language == 'c-cpp'
      run: gcc -O2 -Wall -Wextra -Werror -o chroma-local-guard guard/chroma-local-guard.c

    - name: Analyze
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: /language:${{ matrix.language }}
