# Builds the Linux executables on runners of their own architecture, takes those of Windows and macOS from the release of the Chroma CLI, packs, and runs
# on each platform the tests of the packages with the two engines, the ways to reference them and NativeAOT, the migration from
# 1.5.9.1-preview.5, the download at the first start of each engine, the tests of the guard and the suite of the client against each
# engine; on Linux, also an application published as root and started as another user. A tag publishes the packages of its line: v*
# the base ChromaDotNet.Local, chromadb-v* ChromaDotNet.Local.ChromaDB and its runtime packages, vecturadb-v* ChromaDotNet.Local.VecturaDB.
# Each publishes the GitHub release of the tag, with the Sigstore signatures and the build provenance of its files (for chromadb-v*
# the executables too), then the packages on NuGet, with trusted publishing, in the environment nuget.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'chromadb-v*', 'vecturadb-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux-executables:
    name: Linux ${{ matrix.arch }} executables
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build chroma and the guard from the tag of the Chroma CLI
        run: bash build/build-linux-docker.sh ${{ matrix.arch }}
      - name: Third-party notices
        if: matrix.arch == 'x64'
        run: bash build/third-party-notices.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x64'
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.md

  chroma-cli-and-guard:
    name: Chroma CLI executables and the macOS guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Executables of Windows and macOS of the Chroma CLI, checked against the digests of its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/fetch-chroma-cli.sh
      - name: Guard for macOS
        run: bash build/build-guard-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chroma-cli-and-guard
          path: |
            artifacts/chroma-cli
            artifacts/guard

  pack:
    name: Pack
    needs: [linux-executables, chroma-cli-and-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/download
      - name: Put the executables where the projects take them
        run: |
          mkdir -p artifacts/linux
          cp -r artifacts/download/linux-x64/. artifacts/linux/
          cp -r artifacts/download/linux-arm64/. artifacts/linux/
          cp -r artifacts/download/chroma-cli-and-guard/. artifacts/
          cp artifacts/download/third-party-notices/THIRD-PARTY-NOTICES.md .
          find artifacts/linux artifacts/chroma-cli artifacts/guard -type f | sort
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: The tag is the version of the packages of its line, a preview
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          case "$GITHUB_REF_NAME" in
            chromadb-v*) project=src/ChromaDotNet.Local.ChromaDB; prefix=chromadb-v ;;
            vecturadb-v*) project=src/ChromaDotNet.Local.VecturaDB; prefix=vecturadb-v ;;
            v*) project=src/ChromaDotNet.Local; prefix=v ;;
          esac
          version=$(dotnet msbuild $project -getProperty:Version -nologo)
          echo "tag $GITHUB_REF_NAME, version $version"
          test "$GITHUB_REF_NAME" = "$prefix$version"
          case "$version" in *-preview*) ;; *) echo "only previews for now" >&2; exit 1 ;; esac
      - name: The base of the engine is released, as it is in the tree
        if: startsWith(github.ref, 'refs/tags/chromadb-v') || startsWith(github.ref, 'refs/tags/vecturadb-v')
        run: |
          # The engine depends on this version of the base: users take it from NuGet, and the tests here take the base of this tree.
          base=$(dotnet msbuild src/ChromaDotNet.Local -getProperty:Version -nologo)
          git fetch -q --depth=1 origin "refs/tags/v$base:refs/tags/v$base" || { echo "no tag v$base: release the base first" >&2; exit 1; }
          git diff --quiet "v$base" HEAD -- src/ChromaDotNet.Local || { echo "src/ChromaDotNet.Local changed after v$base: release the base first" >&2; exit 1; }
          curl -fsSL https://api.nuget.org/v3-flatcontainer/chromadotnet.local/index.json \
            | python3 -c "import json, sys; sys.exit(0 if sys.argv[1] in json.load(sys.stdin)['versions'] else 1)" "$base" \
            || { echo "ChromaDotNet.Local $base is not on NuGet: release the base first" >&2; exit 1; }
          echo "ChromaDotNet.Local $base: tag v$base, the same in the tree, on NuGet"
      - name: The hashes of VecturaDB are the digests of its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/check-vecturadb.py
      - name: The notices of VecturaDB at its tag
        run: bash build/vecturadb-notices.sh
      - run: bash build/pack.sh
      - name: The packages link their repository
        run: python3 build/check-nuspecs.py artifacts/packages
      - name: Files of the release of ChromaDotNet.Local.ChromaDB
        run: bash build/release-assets.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: artifacts/release

  test:
    name: Tests on ${{ matrix.runner }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts/release
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Runner
        run: |
          uname -a
          dotnet --info | grep -E "RID|OS Name|OS Version|Architecture" | sort -u
      - name: Tests of the packages, with the two engines
        run: dotnet test tests/ChromaDotNet.Local.Tests -c Release --logger "console;verbosity=normal"
      - name: Tests of the guard
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: |
          guard=$(find artifacts/nuget-cache -path '*/runtimes/*/native/chromadotnet-local-guard' | grep "$(dotnet --info | awk '/ RID:/ {print $2; exit}')" | head -1)
          echo "guard: $guard"
          chmod +x "$guard"
          python3 guard/test_guard.py "$guard"
      - name: The linker of NativeAOT on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev > /dev/null
      - name: The ways to reference the packages, and NativeAOT
        run: bash build/package-modes.sh aot
      - name: The migration from 1.5.9.1-preview.5
        timeout-minutes: 15
        run: bash build/migration-tests.sh
      - name: Published as root, started as another user
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: bash build/nonroot-test.sh "$( [ "$(uname -m)" = x86_64 ] && echo x64 || echo arm64 )"
      - name: The guard in a single file, in a plugin and in a module of PowerShell
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: bash build/guard-hosts-test.sh "$( [ "$(uname -m)" = x86_64 ] && echo x64 || echo arm64 )"
      - name: The download at the first start of ChromaDB
        timeout-minutes: 10
        run: bash build/download-tests.sh chromadb
      - name: The download at the first start of VecturaDB
        timeout-minutes: 10
        run: bash build/download-tests.sh vecturadb
      - name: Suite of the client against ChromaDB
        run: CHROMA_LOCAL_ENGINE=ChromaDB SUITE_LOG=suite-chromadb.log bash build/client-suite.sh
      - name: Suite of the client against VecturaDB
        run: CHROMA_LOCAL_ENGINE=VecturaDB SUITE_LOG=suite-vecturadb.log bash build/client-suite.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-${{ matrix.runner }}
          path: suite-*.log
          if-no-files-found: ignore

  publish:
    name: Publish the preview
    needs: [pack, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nuget
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: The packages and the files of the line of the tag
        id: line
        run: |
          case "$TAG" in
            chromadb-v*) line=chromadb; version=${TAG#chromadb-v}; title="ChromaDotNet.Local.ChromaDB $version"
              packages="ChromaDotNet.Local.ChromaDB.[0-9]* ChromaDotNet.Local.ChromaDB.Runtime.*" ;;
            vecturadb-v*) line=vecturadb; version=${TAG#vecturadb-v}; title="ChromaDotNet.Local.VecturaDB $version"
              packages="ChromaDotNet.Local.VecturaDB.[0-9]*" ;;
            v*) line=base; version=${TAG#v}; title="ChromaDotNet.Local $version"; packages="ChromaDotNet.Local.[0-9]*" ;;
          esac
          mkdir -p out/packages out/release
          for pattern in $packages; do mv packages/$pattern out/packages/; done
          if [ "$line" = chromadb ]; then mv release/*.gz release/SHA256SUMS out/release/; fi
          ls -l out/packages out/release
          { echo "line=$line"; echo "version=$version"; echo "title=$title"; } >> "$GITHUB_OUTPUT"

      - name: Attest the build provenance of the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/packages/*.nupkg

      - name: Attest the build provenance of the executables
        if: steps.line.outputs.line == 'chromadb'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/release/*.gz

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and collect the provenance
        run: |
          shopt -s nullglob
          for file in out/release/* out/packages/*.nupkg; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          for file in out/release/*.gz out/packages/*.nupkg; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "refs/tags/$TAG" --format json --jq '.[].attestation.bundle' >> bundles.jsonl
          done
          sort -u bundles.jsonl > "out/release/provenance-$TAG.intoto.jsonl"
          cp out/packages/*.nupkg out/packages/*.nupkg.sigstore.json out/release/

      - name: GitHub release
        env:
          LINE: ${{ steps.line.outputs.line }}
          VERSION: ${{ steps.line.outputs.version }}
          TITLE: ${{ steps.line.outputs.title }}
        run: |
          chroma=$(dotnet msbuild src/ChromaDotNet.Local.ChromaDB -getProperty:ChromaVersion -nologo)
          cli=$(dotnet msbuild src/ChromaDotNet.Local.ChromaDB -getProperty:ChromaCliTag -nologo)
          vecturadb=$(dotnet msbuild src/ChromaDotNet.Local.VecturaDB -getProperty:VecturaDBTag -nologo)
          sed -e "s/CHROMA_VERSION/$chroma/g" -e "s/CLI_TAG/$cli/g" -e "s/VECTURADB_VERSION/${vecturadb#v}/g" -e "s/VECTURADB_TAG/$vecturadb/g" \
            -e "s/VERSION/$VERSION/g" "build/release-notes/$LINE.md" > notes.md
          gh release create "$TAG" out/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$TITLE" --notes-file notes.md

      - name: The release serves the files the package expects
        if: steps.line.outputs.line == 'chromadb'
        run: |
          mkdir check && cd check
          for file in ../out/release/*.gz ../out/release/SHA256SUMS; do
            name=$(basename "$file")
            curl -fsSL -o "$name" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name"
          done
          sha256sum -c SHA256SUMS

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push 'out/packages/*.nupkg' --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
